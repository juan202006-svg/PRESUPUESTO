name: Compilar APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Instalar plataforma Android
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Instalar Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compilar aplicación (debug)
        run: gradle :app:assembleDebug :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Publicar APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: MiPresupuesto-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
